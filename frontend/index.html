<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swiper</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
            
        .card { transition: transform 0.3s ease-out, opacity 0.3s ease-out; }
    </style>
</head>
<body class="bg-black text-white h-screen flex flex-col font-sans overflow-hidden">
    
    <header class="p-6 border-b border-zinc-800 flex justify-center">
        <h1 class="text-2xl font-bold tracking-tighter text-[#1DB954]">swiper.</h1>
    </header>

    <main id="card-container" class="flex-1 relative flex justify-center items-center w-full max-w-md mx-auto">
        </main>

    <footer class="p-8 flex justify-center gap-8">
        <button id="btn-dislike" class="w-16 h-16 rounded-full bg-zinc-900 border-2 border-red-500 text-red-500 flex justify-center items-center text-3xl hover:bg-red-500 hover:text-white transition-colors">
            ✗
        </button>
        <button id="btn-like" class="w-16 h-16 rounded-full bg-zinc-900 border-2 border-[#1DB954] text-[#1DB954] flex justify-center items-center text-3xl hover:bg-[#1DB954] hover:text-white transition-colors">
            ♥
        </button>
    </footer>

    <script type="module" src="app.js"></script>
</body>
</html>
